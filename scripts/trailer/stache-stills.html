<!doctype html>
<html lang="en">
<head><meta charset="utf-8"></head>
<body style="margin:0;background:transparent">
<!-- Engine stills for the STACHE partnership video (videos/darkbags-stache): the moustached runners,
     the STACHE weapon finishes, style items and the Stache Case, drawn by the game's own renderer.
     node scripts/trailer/make-stills.mjs stache collects them. -->
<script type="module">
  import { drawPreview, weaponArt, drawWeapon } from '/client/stickman.js';
  import { boxArt } from '/client/locker.js';
  import { styleStill } from '/client/flair.js';
  import { BOX, WSKIN, FINISH } from '/shared/cosmetics.js';
  import { WEAPONS } from '/shared/weapons.js';
  const out = {};
  const wi = (id) => WEAPONS.findIndex((w) => w.id === id);
  const runner = (name, look, { w = 0, aim = -0.2, t = 1400 } = {}) => {
    const c = document.createElement('canvas');
    c.width = 1300; c.height = 1200;
    drawPreview(c.getContext('2d'), look, { x: 450, y: 1120, scale: 14, t, w, aim, moveK: 0.15, phase: 0.4 });
    out[name] = c.toDataURL('image/png');
  };
  runner('r-legend', { outfit: 'st-legend', body: 'm', ws: { rifle: 'st-royale' } }, { w: wi('rifle'), aim: 0.05 });
  runner('r-emperor', { outfit: 'st-emperor', body: 'm', ws: { sniper: 'st-handlebar' } }, { w: wi('sniper'), aim: -0.3 });
  runner('r-tycoon', { outfit: 'st-tycoon', body: 'm', ws: { pistol: 'st-navy' } }, { w: wi('pistol'), aim: 0.15 });
  runner('r-silverfox', { outfit: 'st-silverfox', body: 'm', ws: { shotgun: 'st-wax' } }, { w: wi('shotgun'), aim: 0.1 });
  runner('r-baron', { outfit: 'st-baron', body: 'm', ws: { smg: 'st-barberpole' } }, { w: wi('smg'), aim: -0.1 });
  runner('r-viking', { outfit: 'st-viking', body: 'm', ws: { knife: 'st-handlebar' } }, { w: wi('knife'), aim: -0.3 });
  runner('r-gent', { outfit: 'st-gent', body: 'm', ws: { pistol: 'st-wax' } }, { w: wi('pistol'), aim: 0.2 });
  runner('r-bandit', { outfit: 'st-bandit', body: 'm', ws: { shotgun: 'st-bristle' } }, { w: wi('shotgun'), aim: 0 });
  runner('r-barber', { outfit: 'st-barber', body: 'm', ws: { knife: 'st-barberpole' } }, { w: wi('knife'), aim: -0.2 });
  // drawn at w×h, then cut to what is painted (plus a margin), so small art fills its box
  const trim = (c, pad = 16, min = 8) => {
    const d = c.getContext('2d').getImageData(0, 0, c.width, c.height).data;
    let x0 = c.width, y0 = c.height, x1 = -1, y1 = -1;
    for (let y = 0; y < c.height; y++) for (let x = 0; x < c.width; x++) if (d[(y * c.width + x) * 4 + 3] > min) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
    if (x1 < 0) return c;
    x0 = Math.max(0, x0 - pad); y0 = Math.max(0, y0 - pad); x1 = Math.min(c.width - 1, x1 + pad); y1 = Math.min(c.height - 1, y1 + pad);
    const t = document.createElement('canvas');
    t.width = x1 - x0 + 1; t.height = y1 - y0 + 1;
    t.getContext('2d').drawImage(c, -x0, -y0);
    return t;
  };
  const img = (name, url, w, h, cut = false) =>
    new Promise((res) => {
      const i = new Image();
      i.onload = () => {
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(i, 0, 0, w, h);
        out[name] = (cut ? trim(c, 40, cut === true ? 8 : cut) : c).toDataURL('image/png');
        res();
      };
      i.onerror = res;
      i.src = url;
    });
  // a weapon skin as the locker draws it (client/locker.js weaponStill), but big: the locker's
  // still caps its zoom, which leaves a large canvas mostly empty
  const gun = (g, f, w = 600, h = 360) => {
    const s = WSKIN[`${g}.${f}`];
    const art = weaponArt(wi(s.weapon), { [s.weapon]: s.finish });
    const fin = FINISH[s.finish];
    const TILT = -0.3;
    const c = Math.cos(TILT);
    const sn = Math.sin(TILT);
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (const [ax, ay, bx, by, lw] of art.lines)
      for (const [x, y] of [[ax, ay], [bx, by]]) {
        const rx = x * c - y * sn;
        const ry = x * sn + y * c;
        const pad = lw / 2 + 1.5;
        x0 = Math.min(x0, rx - pad); x1 = Math.max(x1, rx + pad); y0 = Math.min(y0, ry - pad); y1 = Math.max(y1, ry + pad);
      }
    const k = Math.min((w * 0.86) / (x1 - x0), (h * 0.8) / (y1 - y0));
    const cv = document.createElement('canvas');
    cv.width = w * 2; cv.height = h * 2;
    const ctx = cv.getContext('2d');
    ctx.scale(2, 2);
    ctx.translate(w / 2 - ((x0 + x1) / 2) * k, h / 2 - ((y0 + y1) / 2) * k);
    ctx.scale(k, k);
    ctx.lineCap = 'round';
    drawWeapon(ctx, { art, grip: { x: 0, y: 0 }, aim: TILT }, false, fin, 800);
    out[`w-${g}-${f}`] = cv.toDataURL('image/png');
  };
  for (const [g, f] of [['rifle', 'st-royale'], ['sniper', 'st-handlebar'], ['smg', 'st-navy'], ['shotgun', 'st-wax'], ['pistol', 'st-barberpole'], ['knife', 'st-bristle']]) gun(g, f);
  for (const id of ['b-stache', 'b-stache-navy', 'f-stache', 'f-stache-gold', 'k-stache-gold', 'n-stache-gold'])
    await img(`s-${id}`, styleStill(id, 480, 280), 960, 560, true);
  let svg = boxArt(BOX['c-stache'], 900);
  if (!svg.includes('xmlns=')) svg = svg.replace('<svg', '<svg xmlns="http://www.w3.org/2000/svg"');
  await img('case', `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`, 900, 900);
  window.__stills = out;
  document.body.dataset.ready = '1';
</script>
</body>
</html>
