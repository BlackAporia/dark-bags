<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- The YouTube thumbnail for the teaser: 1280×720 (shot at 1.5× = 1920×1080). It has to read
     at the size of a stamp in a feed: three words, a brand mark and the runners. YouTube puts the
     video's length in the bottom-right corner, so that corner stays empty. The runners and the
     bag are drawn by the game's own renderer. -->
<link rel="stylesheet" href="../og/fonts/fonts.css">
<style>
  html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; background: #05060a; }
  .y { position: relative; width: 1280px; height: 720px; overflow: hidden; font-family: 'Chakra Petch', sans-serif; color: #efe9dc;
    background:
      radial-gradient(40% 70% at 74% 62%, rgba(255, 170, 40, 0.42), transparent 66%),
      radial-gradient(30% 50% at 100% 0%, rgba(255, 61, 127, 0.3), transparent 70%),
      radial-gradient(40% 60% at 0% 100%, rgba(0, 200, 255, 0.16), transparent 70%),
      #06070c; }
  .grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,0.045) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.045) 1px, transparent 1px); background-size: 48px 48px; mask-image: radial-gradient(70% 90% at 70% 60%, #000 30%, transparent 85%); }
  .storm { position: absolute; width: 1700px; height: 1700px; left: 420px; top: -900px; border-radius: 50%; border: 4px dashed rgba(255, 61, 127, 0.45); box-shadow: 0 0 80px rgba(255, 61, 127, 0.25) inset; }
  .beam { position: absolute; width: 300px; height: 820px; left: 820px; top: -60px; background: linear-gradient(90deg, transparent, rgba(255, 220, 150, 0.18), transparent); filter: blur(10px); transform: rotate(8deg); }
  canvas#scene { position: absolute; inset: 0; width: 1280px; height: 720px; }
  .copy { position: absolute; left: 64px; top: 0; bottom: 0; width: 640px; display: flex; flex-direction: column; justify-content: center; }
  .brand { display: inline-flex; align-self: flex-start; gap: 10px; align-items: baseline; padding: 12px 18px 10px; border-radius: 14px; background: rgba(5, 6, 10, 0.86); border: 2px solid rgba(255, 154, 31, 0.7); font: 900 46px/0.9 'Big Shoulders Stencil Display', sans-serif; text-transform: uppercase; letter-spacing: 0.02em; box-shadow: 0 10px 40px rgba(0,0,0,0.6); }
  .brand b { color: #ff9a1f; }
  h1 { margin: 22px 0 0; font: 900 196px/0.88 'Big Shoulders Stencil Display', sans-serif; text-transform: uppercase; }
  h1 span { display: block; }
  h1 .a { color: #ff9a1f; text-shadow: 0 10px 0 rgba(0,0,0,0.6), 0 0 70px rgba(255, 140, 30, 0.7); }
  h1 .b { color: #f6f1e6; text-shadow: 0 10px 0 rgba(0,0,0,0.6); }
  .chips { display: flex; gap: 12px; margin-top: 28px; }
  .chip { font: 700 22px/1 'IBM Plex Mono', monospace; letter-spacing: 0.06em; text-transform: uppercase; padding: 13px 16px; border-radius: 12px; border: 2px solid rgba(255, 180, 67, 0.7); background: rgba(10, 10, 16, 0.86); color: #ffd58a; }
  .chip.c2 { border-color: rgba(76, 201, 240, 0.7); color: #9fe6ff; }
  .hazard { position: absolute; left: 0; right: 0; bottom: 0; height: 14px; background: repeating-linear-gradient(135deg, #f4b400 0 20px, #0b0b0b 20px 40px); opacity: 0.9; }
  .vignette { position: absolute; inset: 0; box-shadow: inset 0 0 180px rgba(0,0,0,0.85); pointer-events: none; }
</style>
</head>
<body>
<div class="y" id="y">
  <div class="grid"></div>
  <div class="storm"></div>
  <div class="beam"></div>
  <canvas id="scene" width="2560" height="1440"></canvas>
  <div class="copy">
    <div class="brand">Dark <b>Bags</b></div>
    <h1><span class="a">Get out</span><span class="b">alive.</span></h1>
    <div class="chips"><span class="chip">17 modes</span><span class="chip c2">Free in browser</span></div>
  </div>
  <div class="hazard"></div>
  <div class="vignette"></div>
</div>
<script type="module">
  import { drawPreview } from '/client/stickman.js';
  import { boxArt } from '/client/locker.js';
  import { BOX } from '/shared/cosmetics.js';
  await Promise.all(["900 200px 'Big Shoulders Stencil Display'", "700 22px 'Chakra Petch'", "700 22px 'IBM Plex Mono'"].map((f) => document.fonts.load(f)));
  const cv = document.getElementById('scene');
  const ctx = cv.getContext('2d');
  ctx.scale(2, 2);
  const floorY = 660;
  const disc = (x, r, c) => {
    const g = ctx.createRadialGradient(x, floorY, 4, x, floorY, r);
    g.addColorStop(0, c);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.ellipse(x, floorY, r, r * 0.2, 0, 0, Math.PI * 2);
    ctx.fill();
  };
  disc(960, 280, 'rgba(255,190,70,0.65)');
  disc(760, 170, 'rgba(170,90,255,0.5)');
  disc(1160, 170, 'rgba(255,61,127,0.5)');
  let seed = 31;
  const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
  for (let i = 0; i < 90; i++) {
    const x = 640 + rnd() * 640, y = 30 + rnd() * 640, r = 0.7 + rnd() * 2.4;
    ctx.fillStyle = rnd() < 0.55 ? 'rgba(255,214,110,0.85)' : 'rgba(255,255,255,0.6)';
    ctx.shadowColor = '#ffb443';
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.shadowBlur = 0;
  const bag = (id, x, y, s, rot = 0) =>
    new Promise((res) => {
      const img = new Image();
      img.onload = () => {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(rot);
        ctx.shadowColor = 'rgba(255,190,70,0.9)';
        ctx.shadowBlur = 50;
        ctx.drawImage(img, -s / 2, -s / 2, s, s);
        ctx.restore();
        res();
      };
      img.onerror = res;
      let svg = boxArt(BOX[id], s);
      if (!svg.includes('xmlns=')) svg = svg.replace('<svg', '<svg xmlns="http://www.w3.org/2000/svg"');
      img.src = `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`;
    });
  await bag('genesis', 1150, 170, 150, 0.12);
  await bag('w-apex', 700, 150, 110, -0.15);
  const runner = (outfit, ws, w, x, scale, aim, body = 'm') => drawPreview(ctx, { outfit, body, ws }, { x, y: floorY, scale, t: 1400, w, aim, moveK: 0.15, phase: 0.4 });
  runner('void-emperor', { sniper: 'void' }, 12, 760, 4.8, -0.5);
  runner('neon-samurai', { knife: 'prism' }, 0, 1160, 4.8, -0.4, 'f');
  runner('golden-bull', { rifle: 'supernova' }, 7, 950, 6.6, 0.08);
  document.body.dataset.ready = '1';
</script>
</body>
</html>
