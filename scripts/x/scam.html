<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- The scam warning for X: 1600×900 (16:9, shot at 1.2×). DARK BAGS has no token, and a coin
     carrying our name or logo is somebody else's. The proof is the launchpad listing itself
     (scam-shot.png: the rows only, cropped above the page header so no wallet shows): the other
     projects' rows are dimmed, the fake "Dark Bags" row is circled and stamped. -->
<link rel="stylesheet" href="../og/fonts/fonts.css">
<style>
  html, body { margin: 0; width: 1600px; height: 900px; overflow: hidden; background: #05060a; }
  .s { position: relative; width: 1600px; height: 900px; overflow: hidden; font-family: 'Chakra Petch', sans-serif; color: #efe9dc;
    background:
      radial-gradient(40% 50% at 70% 72%, rgba(255, 45, 70, 0.26), transparent 70%),
      radial-gradient(40% 60% at 0% 0%, rgba(255, 170, 40, 0.10), transparent 70%),
      #06070c; }
  .grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px); background-size: 56px 56px; mask-image: radial-gradient(70% 90% at 50% 40%, #000 30%, transparent 85%); }
  .copy { position: absolute; left: 96px; top: 62px; width: 860px; }
  .kicker { display: inline-flex; align-items: center; gap: 14px; font: 700 26px/1 'IBM Plex Mono', monospace; letter-spacing: 0.24em; text-transform: uppercase; color: #fff; background: #e8263f; padding: 14px 20px; border-radius: 10px; box-shadow: 0 0 40px rgba(232, 38, 63, 0.55); }
  h1 { margin: 26px 0 0; font: 900 132px/0.86 'Big Shoulders Stencil Display', sans-serif; text-transform: uppercase; }
  h1 span { display: block; }
  h1 .a { color: #f3eee2; text-shadow: 0 8px 0 rgba(0,0,0,0.6); }
  h1 .b { color: #ff3d55; text-shadow: 0 8px 0 rgba(0,0,0,0.55), 0 0 60px rgba(255, 45, 70, 0.55); }
  .line { position: absolute; left: 960px; right: 96px; top: 150px; margin: 0; font: 600 32px/1.32 'Chakra Petch', sans-serif; color: #fff; }
  .line b { color: #ffb443; }
  .shot { position: absolute; left: 96px; top: 420px; width: 1408px; height: 311px; border-radius: 16px; overflow: visible; transform: rotate(-1.2deg); }
  .shot img { display: block; width: 1408px; height: 311px; border-radius: 16px; box-shadow: 0 0 0 2px rgba(255,255,255,0.12), 0 30px 80px rgba(0,0,0,0.7); }
  .shot .dim { position: absolute; left: 0; top: 0; width: 1408px; height: 212px; border-radius: 16px 16px 0 0; background: rgba(4, 5, 9, 0.62); }
  .shot .ring { position: absolute; left: 2px; top: 206px; width: 1380px; height: 82px; border-radius: 14px; border: 5px solid #ff2d46; box-shadow: 0 0 34px rgba(255, 45, 70, 0.8), inset 0 0 24px rgba(255, 45, 70, 0.35); }
  .shot .stamp { position: absolute; left: 640px; top: 176px; transform: rotate(-7deg); font: 900 64px/1 'Big Shoulders Stencil Display', sans-serif; letter-spacing: 0.06em; text-transform: uppercase; color: #ff2d46; padding: 8px 22px 6px; border: 6px solid #ff2d46; border-radius: 12px; background: rgba(12, 4, 6, 0.86); box-shadow: 0 0 40px rgba(255, 45, 70, 0.6); }
  .shot .src { position: absolute; left: 4px; top: -40px; font: 600 20px/1 'IBM Plex Mono', monospace; letter-spacing: 0.14em; text-transform: uppercase; color: #a9a39a; }
  .official { position: absolute; left: 96px; right: 96px; bottom: 60px; display: flex; align-items: center; gap: 18px; flex-wrap: nowrap; }
  .official .lbl { font: 700 22px/1 'IBM Plex Mono', monospace; letter-spacing: 0.18em; text-transform: uppercase; color: #3ddc97; white-space: nowrap; }
  .chip { font: 700 26px/1 'IBM Plex Mono', monospace; padding: 15px 18px; border-radius: 12px; border: 2px solid rgba(61, 220, 151, 0.6); background: rgba(5, 12, 10, 0.85); color: #d9ffe9; white-space: nowrap; }
  .hazard { position: absolute; left: 0; right: 0; bottom: 0; height: 18px; background: repeating-linear-gradient(135deg, #e8263f 0 24px, #0b0b0b 24px 48px); }
  .hazard.top { top: 0; bottom: auto; }
  .vignette { position: absolute; inset: 0; box-shadow: inset 0 0 200px rgba(0,0,0,0.8); pointer-events: none; }
</style>
</head>
<body>
<div class="s" id="s">
  <div class="grid"></div>
  <div class="hazard top"></div>
  <div class="copy">
    <div class="kicker">⚠ Scam alert</div>
    <h1><span class="a">This is not</span><span class="b">our token</span></h1>
  </div>
  <p class="line">DARK BAGS never launched a coin, presale or airdrop. A token with our <b>name or logo</b> is a scam. Don't buy it.</p>
  <div class="shot">
    <div class="src">Seen on a Starknet launchpad ▾</div>
    <img src="scam-shot.png" alt="">
    <div class="dim"></div>
    <div class="ring"></div>
    <div class="stamp">Fake · not ours</div>
  </div>
  <div class="official">
    <span class="lbl">Official only ▸</span>
    <span class="chip">𝕏 @play_dark_bags</span>
    <span class="chip">Telegram t.me/dark_bags_starknet</span>
    <span class="chip">dark-bags.com</span>
  </div>
  <div class="hazard"></div>
  <div class="vignette"></div>
</div>
<script>Promise.all([document.fonts.ready, document.querySelector('img').decode()]).then(() => { document.body.dataset.ready = '1'; });</script>
</body>
</html>
