<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- The X profile picture: 400×400 (shot at 2×). X shows it as a circle, small: one bold sign,
     the bag of the game's icon, centred well inside the circle on the night-map dark. -->
<style>
  html, body { margin: 0; width: 400px; height: 400px; overflow: hidden; background: #05060a; }
  .a { position: relative; width: 400px; height: 400px; overflow: hidden;
    background:
      radial-gradient(55% 55% at 50% 56%, rgba(255, 160, 40, 0.42), transparent 70%),
      radial-gradient(80% 80% at 50% 40%, #1c2232, #05060a 75%); }
  .grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px); background-size: 28px 28px; mask-image: radial-gradient(50% 50% at 50% 55%, #000 30%, transparent 80%); }
  .ring { position: absolute; inset: 22px; border-radius: 50%; border: 3px dashed rgba(120, 200, 255, 0.35); }
  svg { position: absolute; left: 60px; top: 56px; width: 280px; height: 280px; filter: drop-shadow(0 0 26px rgba(255, 150, 40, 0.65)) drop-shadow(0 10px 0 rgba(0,0,0,0.45)); }
</style>
</head>
<body>
<div class="a" id="a">
  <div class="grid"></div>
  <div class="ring"></div>
  <svg viewBox="0 0 64 64" aria-hidden="true">
    <defs><linearGradient id="bag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd06a"/><stop offset="1" stop-color="#f07f12"/></linearGradient></defs>
    <path d="M23.5 25v-4.5a8.5 8.5 0 0 1 17 0V25" fill="none" stroke="#ebe5d6" stroke-width="4.2" stroke-linecap="round"/>
    <path d="M13.5 25h37l-3.6 25.6a4.5 4.5 0 0 1-4.46 3.9H21.56a4.5 4.5 0 0 1-4.46-3.9z" fill="url(#bag)"/>
    <path d="M13.5 25h37l-.6 4.4h-35.8z" fill="#000" opacity=".22"/>
    <path d="M32 33.5l6.2 7.2L32 47.9l-6.2-7.2z" fill="#05060a"/>
    <path d="M32 36.6l3.5 4.1-3.5 4.1-3.5-4.1z" fill="#3ce6ff"/>
  </svg>
</div>
<script>document.body.dataset.ready = '1';</script>
</body>
</html>
