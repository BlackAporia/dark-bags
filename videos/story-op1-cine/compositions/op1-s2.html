<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="../lib/gsap.min.js"></script>
    <script src="../lib/film.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
      }
      #op1-s2-cv {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <!-- Operation 1, The Tunnels: every frame is drawn by lib/film.js from the time alone -->
    <div id="root" data-composition-id="op1-s2" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <canvas id="op1-s2-cv" class="clip" width="1920" height="1080" data-start="0" data-duration="6" data-track-index="0"></canvas>
      <audio id="op1-s2-audio" src="../assets/op1-s2-audio.wav" data-start="0" data-duration="6" data-track-index="1"></audio>
    </div>
    <script>
      const cv = document.getElementById('op1-s2-cv');
      const clock = { t: 0 };
      const tl = gsap.timeline({ paused: true });
      tl.to(clock, { t: 6, duration: 6, ease: 'none', onUpdate: () => drawFilmFrame(cv, 'op1-s2', clock.t) }, 0);
      drawFilmFrame(cv, 'op1-s2', 0);
      window.__timelines['op1-s2'] = tl;
    </script>
  </body>
</html>
