[package]
name = "dark_bags"
version = "0.1.0"
edition = "2024_07"

# The DARK BAGS vault: the game's private money on Starknet, plugged into the STRK20 privacy pool.
# See contracts/README.md.

[dependencies]
starknet = "2.17.0"

[dev-dependencies]
snforge_std = { git = "https://github.com/foundry-rs/starknet-foundry", tag = "v0.63.0" }
assert_macros = "2.17.0"

[[target.starknet-contract]]
sierra = true
casm = true

[scripts]
test = "snforge test"

[tool.fmt]
sort-module-level-items = true
