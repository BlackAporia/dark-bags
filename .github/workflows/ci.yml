name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run sim -- 2 1000
      - run: npm run build:wallets
      - run: npm run build
        env:
          DARK_BAGS_SERVER: ${{ vars.DARK_BAGS_SERVER }}
      - name: Attach the single-file build
        uses: actions/upload-artifact@v4
        with:
          name: dark-bags-single-file
          path: |
            dist/play/index.html
            dist/index.html

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Scarb, Starknet Foundry and the Sierra compiler
        run: |
          set -e
          mkdir -p "$HOME/cairo" && cd "$HOME/cairo"
          curl -sSL https://github.com/software-mansion/scarb/releases/download/v2.17.0/scarb-v2.17.0-x86_64-unknown-linux-gnu.tar.gz | tar xz
          curl -sSL https://github.com/foundry-rs/starknet-foundry/releases/download/v0.63.0/starknet-foundry-v0.63.0-x86_64-unknown-linux-gnu.tar.gz | tar xz
          curl -sSL https://github.com/software-mansion/universal-sierra-compiler/releases/download/v2.9.0/universal-sierra-compiler-v2.9.0-x86_64-unknown-linux-gnu.tar.gz | tar xz
          echo "$HOME/cairo/scarb-v2.17.0-x86_64-unknown-linux-gnu/bin" >> "$GITHUB_PATH"
          echo "$HOME/cairo/starknet-foundry-v0.63.0-x86_64-unknown-linux-gnu/bin" >> "$GITHUB_PATH"
          echo "$HOME/cairo/universal-sierra-compiler-v2.9.0-x86_64-unknown-linux-gnu/bin" >> "$GITHUB_PATH"
      - run: scarb build
        working-directory: contracts
      - run: snforge test
        working-directory: contracts
