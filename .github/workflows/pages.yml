name: Deploy demo to GitHub Pages

# Publishes the single-file build (practice mode, plus Online if the repo variable
# DARK_BAGS_SERVER points at a running game server). Skips cleanly while Pages is off:
# enable it under Settings → Pages → Source: GitHub Actions.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check that Pages is enabled
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" > /dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages is off for this repo, so the demo was not deployed. Settings → Pages → Source: GitHub Actions turns it on."
          fi
      - uses: actions/checkout@v4
        if: steps.pages.outputs.enabled == 'true'
      - uses: actions/setup-node@v4
        if: steps.pages.outputs.enabled == 'true'
        with:
          node-version: 22
          cache: npm
      - if: steps.pages.outputs.enabled == 'true'
        run: npm ci && npm run build
        env:
          DARK_BAGS_SERVER: ${{ vars.DARK_BAGS_SERVER }}
      - if: steps.pages.outputs.enabled == 'true'
        run: rm dist/artifact.html
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outputs.enabled == 'true'
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        if: steps.pages.outputs.enabled == 'true'
