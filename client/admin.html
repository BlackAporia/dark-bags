<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>DARK BAGS · Аналітика</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil+Display:wght@900&family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  :root {
    --bg: #07080d; --surface: #0d0f18; --surface-2: #131624; --line: rgba(255,255,255,0.08);
    --ink: #efe9dc; --ink-2: #b9bfcf; --muted: #7d8497;
    --gold: #ffb443; --s1: #d98a2b; --dep: #3a8fd6; --wd: #c97624;
    --good: #3ddc97; --warn: #f4b400; --bad: #ff5c6c;
  }
  * { box-sizing: border-box; }
  html { color-scheme: dark; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 500 15px/1.4 'Chakra Petch', system-ui, sans-serif;
    background-image: radial-gradient(60% 40% at 80% 0%, rgba(255,170,40,0.08), transparent 70%), linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
    background-size: auto, 48px 48px, 48px 48px; }
  a { color: var(--gold); }
  .wrap { max-width: 1320px; margin: 0 auto; padding: 24px 16px 60px; }
  header.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; padding-bottom: 18px; border-bottom: 1px solid var(--line); }
  .brand small { font: 600 12px/1 'IBM Plex Mono', monospace; letter-spacing: 0.3em; color: var(--gold); text-transform: uppercase; }
  .brand h1 { margin: 6px 0 0; font: 900 52px/0.9 'Big Shoulders Stencil Display', sans-serif; text-transform: uppercase; letter-spacing: 0.01em; }
  .brand h1 b { background: linear-gradient(180deg, #ffd56a, #ff8a1f); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .age { text-align: right; }
  .age small { color: var(--muted); font: 600 11px/1 'IBM Plex Mono', monospace; letter-spacing: 0.2em; text-transform: uppercase; }
  .age .clock { font: 600 34px/1.1 'IBM Plex Mono', monospace; color: var(--ink); font-variant-numeric: tabular-nums; }
  .age .clock i { font-style: normal; color: var(--muted); font-size: 18px; margin: 0 6px 0 2px; }
  .meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; justify-content: flex-end; }
  .pill { font: 600 12px/1 'IBM Plex Mono', monospace; padding: 6px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--ink-2); background: var(--surface); white-space: nowrap; }
  .pill.net { color: #0b0b0b; background: var(--gold); border-color: transparent; }
  .pill.net.test { background: #7d8497; }
  .pill.langs { padding: 2px; display: inline-flex; gap: 2px; }
  .pill.langs button { font: 700 11px/1 'IBM Plex Mono', monospace; color: var(--ink-2); background: transparent; border: 0; padding: 5px 8px; border-radius: 999px; cursor: pointer; }
  .pill.langs button.on { color: #0b0b0b; background: var(--gold); }
  .pill .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--good); margin-right: 6px; box-shadow: 0 0 8px var(--good); }
  nav.tabs { display: flex; gap: 6px; overflow-x: auto; margin: 18px 0 6px; scrollbar-width: none; }
  nav.tabs button { font: 700 13px/1 'Chakra Petch', sans-serif; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2); background: var(--surface); border: 1px solid var(--line); padding: 10px 14px; border-radius: 10px; cursor: pointer; white-space: nowrap; }
  nav.tabs button.on { color: #0b0b0b; background: linear-gradient(180deg, #ffc24d, #ff8a1f); border-color: transparent; }
  section { margin-top: 22px; }
  h2 { font: 700 14px/1 'IBM Plex Mono', monospace; letter-spacing: 0.24em; text-transform: uppercase; color: var(--gold); margin: 0 0 12px; display: flex; align-items: center; gap: 10px; }
  h2::before { content: ''; width: 26px; height: 3px; background: var(--gold); box-shadow: 0 0 8px var(--gold); }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
  .tile { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 14px 12px; min-width: 0; }
  .tile small { display: block; color: var(--muted); font: 600 11px/1.25 'IBM Plex Mono', monospace; letter-spacing: 0.06em; text-transform: uppercase; }
  .tile b { display: block; font: 700 26px/1.15 'Chakra Petch', sans-serif; margin-top: 6px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .tile span { display: block; color: var(--ink-2); font-size: 12px; margin-top: 2px; }
  .tile.hl { border-color: rgba(255,180,67,0.45); background: linear-gradient(180deg, rgba(255,180,67,0.08), var(--surface)); }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 520px), 1fr)); gap: 12px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; min-width: 0; }
  .card h3 { margin: 0 0 10px; font: 700 15px/1.2 'Chakra Petch', sans-serif; display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .card h3 small { color: var(--muted); font: 500 12px/1.2 'IBM Plex Mono', monospace; }
  .chart { position: relative; }
  .chart svg { display: block; width: 100%; height: auto; overflow: visible; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; color: var(--ink-2); font-size: 12px; margin-bottom: 6px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
  .tip { position: absolute; pointer-events: none; background: #1a1d2c; border: 1px solid rgba(255,255,255,0.14); border-radius: 8px; padding: 7px 9px; font: 500 12px/1.35 'IBM Plex Mono', monospace; color: var(--ink); white-space: nowrap; transform: translate(-50%, -110%); box-shadow: 0 8px 24px rgba(0,0,0,0.5); z-index: 5; }
  .tip b { color: var(--ink); }
  .bars { display: grid; gap: 8px; }
  .bar { display: grid; grid-template-columns: minmax(92px, 150px) 1fr auto; gap: 10px; align-items: center; font-size: 13px; }
  .bar .lab { color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar .trk, .bar .fill { display: block; }
  .bar .trk { height: 12px; background: rgba(255,255,255,0.04); border-radius: 4px; overflow: hidden; }
  .bar .fill { height: 100%; background: var(--s1); border-radius: 0 4px 4px 0; min-width: 2px; }
  .bar .val { font: 600 12px/1 'IBM Plex Mono', monospace; color: var(--ink); text-align: right; white-space: nowrap; }
  .tbl { width: 100%; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; color: var(--muted); font: 600 11px/1.2 'IBM Plex Mono', monospace; letter-spacing: 0.06em; text-transform: uppercase; padding: 8px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  td { padding: 8px; border-bottom: 1px solid rgba(255,255,255,0.04); white-space: nowrap; font-variant-numeric: tabular-nums; }
  td.r, th.r { text-align: right; }
  td.mono { font-family: 'IBM Plex Mono', monospace; font-size: 12px; }
  .ok { color: var(--good); } .warn { color: var(--warn); } .bad { color: var(--bad); } .mut { color: var(--muted); }
  .gate { max-width: 520px; margin: 12vh auto 0; text-align: center; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 30px 22px; }
  .gate h2 { justify-content: center; }
  .gate p { color: var(--ink-2); }
  .cta { display: inline-block; font: 800 15px/1 'Chakra Petch', sans-serif; letter-spacing: 0.12em; text-transform: uppercase; color: #0b0b0b; background: linear-gradient(180deg, #ffc24d, #ff8a1f); padding: 13px 20px; border-radius: 12px; text-decoration: none; border: 0; cursor: pointer; }
  .ghost { font: 700 12px/1 'Chakra Petch', sans-serif; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-2); background: transparent; border: 1px solid var(--line); padding: 8px 12px; border-radius: 10px; cursor: pointer; }
  .note { color: var(--muted); font-size: 12px; margin-top: 8px; }
  .addr { font: 500 12px/1.3 'IBM Plex Mono', monospace; color: var(--ink-2); overflow-wrap: anywhere; }
  [hidden] { display: none !important; }
  @media (max-width: 640px) { .brand h1 { font-size: 40px; } .age { text-align: left; } .meta { justify-content: flex-start; } .age .clock { font-size: 26px; } .tile b { font-size: 22px; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><small>Тільки для команди</small><h1>Dark <b>Bags</b> · аналітика</h1></div>
    <div class="age">
      <small>Гра існує</small>
      <div class="clock" id="age">—</div>
      <div class="meta" id="meta"></div>
    </div>
  </header>
  <div id="gate" class="gate" hidden></div>
  <div id="app" hidden>
    <nav class="tabs" id="tabs"></nav>
    <div id="view"></div>
  </div>
</div>
<script type="module" src="admin.js"></script>
</body>
</html>
