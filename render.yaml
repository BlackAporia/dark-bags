# Render Blueprint: New → Blueprint → pick this repo. Free web services support WebSockets
# (they sleep after ~15 idle minutes, so the first visit after a pause takes a while).
services:
  - type: web
    name: dark-bags
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build:wallets
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: ROUND_SECONDS
        value: "180"
      - key: BOTS
        value: "1"
      # Real tokens: set CHAIN=sepolia (or mainnet) plus HOUSE_ADDRESS, HOUSE_PRIVATE_KEY and
      # CASHIER_FILE on a persistent disk. See "Real tokens" in the README for the rest.
      - key: CHAIN
        value: "off"
